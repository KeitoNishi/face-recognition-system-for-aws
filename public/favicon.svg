<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="eyeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00cc66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008844;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="pupilGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc3300;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景の円 -->
  <circle cx="16" cy="16" r="15" fill="#1a1a2e" stroke="#2d2d5a" stroke-width="1"/>
  
  <!-- 目の外側の円 -->
  <circle cx="16" cy="16" r="12" fill="url(#eyeGradient)" filter="url(#glow)"/>
  
  <!-- 目の内側の円 -->
  <circle cx="16" cy="16" r="8" fill="#ffffff" opacity="0.3"/>
  
  <!-- 瞳孔 -->
  <circle cx="16" cy="16" r="4" fill="url(#pupilGradient)"/>
  
  <!-- 光の反射 -->
  <circle cx="14" cy="14" r="1.5" fill="#ffffff" opacity="0.8"/>
  
  <!-- 周囲の光の粒子 -->
  <circle cx="8" cy="8" r="0.8" fill="#ffaa00" opacity="0.6"/>
  <circle cx="24" cy="10" r="0.6" fill="#ffaa00" opacity="0.4"/>
  <circle cx="6" cy="20" r="0.7" fill="#ffaa00" opacity="0.5"/>
  <circle cx="26" cy="22" r="0.5" fill="#ffaa00" opacity="0.3"/>
</svg> 