server {
    listen 80;
    server_name photogallery.jos2025tokyo.jp;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name photogallery.jos2025tokyo.jp;
    
    ssl_certificate /etc/letsencrypt/live/photogallery.jos2025tokyo.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photogallery.jos2025tokyo.jp/privkey.pem;
    
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
} 